name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Periksa sintaks JavaScript
        run: |
          node --check app.js
          node --check auth.js
          node --check attachments.js
          node --check smooth-scroll.js
      - name: Uji batas lampiran
        run: node --test tests/*.test.cjs
